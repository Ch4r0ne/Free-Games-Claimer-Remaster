name: Notification Tests

on:
  pull_request:
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/notification-tests.yml"
  push:
    branches: [main, dev]
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/notification-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py src tests
